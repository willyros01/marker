# The Marker's worker. Deployed only by .github/workflows/deploy-worker.yml.
name = "marker"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PROJECT = "scorecard-f41b8"
ORIGINS = "https://willyros01.github.io,capacitor://localhost,https://localhost"
VERSION = "dev"

# Cloudflare's AI, for reading scorecard photos (free daily allowance).
[ai]
binding = "AI"

[triggers]
# One waiting card per run: a free-plan run may make 50 requests.
# Daily golfer clean-up, 07:00 UTC (must match DAILY in src/index.js).
crons = ["*/5 * * * *", "0 7 * * *"]

[observability]
enabled = true
