name: Tests (app logic and Firebase rules)

# Runs on every push. Uses the Firebase emulator only; nothing live is touched.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools (exact versions)
        run: |
          npm install -g firebase-tools@15.31.0
          npm install --no-audit --no-fund
      - name: App logic tests
        run: npm test
      - name: Firebase rules tests (emulator)
        run: npm run -s test:rules
