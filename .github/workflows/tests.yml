name: Tests (app logic and Firebase rules)

# Runs on every push. Uses the Firebase emulator only; nothing live is touched.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # only to save the test log to the ci-logs branch

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools (exact versions)
        run: |
          npm install -g firebase-tools@15.31.0
          npm install --no-audit --no-fund
      - name: App logic tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log
      - name: Firebase rules tests (emulator)
        run: |
          set -o pipefail
          npm run -s test:rules 2>&1 | tee rules.log
      - name: Save the logs to the ci-logs branch
        if: always()
        run: |
          set -e
          dir="logs/tests/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p "/tmp/$dir"; cp unit.log rules.log "/tmp/$dir/" 2>/dev/null || true
          git config user.name "marker-ci"; git config user.email "marker-ci@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -B ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
          mkdir -p "$dir"; cp /tmp/$dir/* "$dir/" 2>/dev/null || true
          git add logs && git commit -qm "Test logs ${GITHUB_RUN_NUMBER}" && git push -q origin ci-logs
