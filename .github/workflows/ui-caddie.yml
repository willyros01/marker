name: Caddie scoring (two browsers, emulators)

# Member and caddie in two browsers against the Firebase emulators and a local
# stand-in for the worker (test/ui/caddie-server.mjs). Nothing live is touched.
# Screenshots and the log go to the ci-logs branch under logs/ui-caddie/.
on:
  push:
    paths:
      - app.js
      - store.js
      - card.js
      - styles.css
      - worker/src/caddie.js
      - worker/src/follow.js
      - test/ui/**
      - .github/workflows/ui-caddie.yml
  workflow_dispatch:

permissions:
  contents: write   # only to save the log and screenshots to ci-logs

jobs:
  caddie:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install test tools (exact versions)
        run: |
          npm install -g firebase-tools@15.31.0
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright@1.48.2 install --with-deps chromium
      - name: Run
        env: { SHOTS: /tmp/shots }
        run: |
          set -o pipefail
          bash test/ui/run-caddie.sh 2>&1 | tee ui.log
      - name: Save the log and screenshots to the ci-logs branch
        if: always()
        run: |
          set -e
          dir="logs/ui-caddie/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p "/tmp/$dir"; cp ui.log "/tmp/$dir/" 2>/dev/null || true; cp /tmp/shots/*.png "/tmp/$dir/" 2>/dev/null || true
          cp /tmp/caddie-server.log "/tmp/$dir/" 2>/dev/null || true
          git config user.name "marker-ci"; git config user.email "marker-ci@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin ci-logs && git checkout -q -B ci-logs origin/ci-logs
            git rm -rq --cached . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
            mkdir -p "$dir"; cp /tmp/$dir/* "$dir/" 2>/dev/null || true
            git add logs && git commit -qm "ui-caddie ${GITHUB_RUN_NUMBER}" && git push -q origin ci-logs && break
            sleep 5
          done
