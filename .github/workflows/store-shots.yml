name: App Store pictures (emulators)

# The App Store pictures (iPhone 6.9-inch and iPad 13-inch) from the real web
# app against the Firebase emulators and the worker stand-in, with fictional
# golfers. Nothing live is touched. Pictures go to ci-logs under logs/store-shots/.
on:
  push:
    branches: [main]
    paths:
      - test/ui/store-shots.mjs
      - .github/workflows/store-shots.yml
  workflow_dispatch:

permissions:
  contents: write   # only to save the log and screenshots to ci-logs

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install test tools (exact versions)
        run: |
          npm install -g firebase-tools@15.31.0
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright@1.48.2 install --with-deps chromium
      - name: Run
        env: { SHOTS: /tmp/shots }
        run: |
          set -o pipefail
          bash test/ui/run-store-shots.sh 2>&1 | tee ui.log
      - name: Save the log and screenshots to the ci-logs branch
        if: always()
        run: |
          set -e
          dir="logs/store-shots/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p "/tmp/$dir"; cp ui.log "/tmp/$dir/" 2>/dev/null || true; cp /tmp/shots/*.png "/tmp/$dir/" 2>/dev/null || true
          cp /tmp/caddie-server.log "/tmp/$dir/" 2>/dev/null || true
          git config user.name "marker-ci"; git config user.email "marker-ci@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin ci-logs && git checkout -q -B ci-logs origin/ci-logs
            git rm -rq --cached . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
            mkdir -p "$dir"; cp /tmp/$dir/* "$dir/" 2>/dev/null || true
            git add logs && git commit -qm "store-shots ${GITHUB_RUN_NUMBER}" && git push -q origin ci-logs && break
            sleep 5
          done
