name: The apps' Gmail (save the app password, send one test email)

# Willy, 13 Nov 2026: the Gmail app password of thescorecard.marker@gmail.com
# is pasted once into the GitHub secret GMAIL_APP_PASSWORD. This run (started
# by Claude) saves it in secretKeys/mailSender (no app can read it; only the
# Cloudflare helper does), reads it back, and has the helper send ONE test
# email to thescorecard.marker@gmail.com itself. The password is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: scorecard-f41b8
  GMAIL: thescorecard.marker@gmail.com

jobs:
  gmail:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Keyless sign-in to Google
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/811267714235/locations/global/workloadIdentityPools/scorecard-github/providers/marker-provider
          service_account: marker-deployer@scorecard-f41b8.iam.gserviceaccount.com
          token_format: access_token
      - name: Save the app password and send the test email
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PASS_RAW: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          FS="https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents"
          PASS="$(printf '%s' "$PASS_RAW" | tr -d ' \t\r\n')"
          [[ "$PASS" =~ ^[A-Za-z]{16}$ ]] || { echo "::error title=Not 16 letters::The GitHub secret GMAIL_APP_PASSWORD is not a 16-letter app password."; exit 1; }
          echo "::add-mask::$PASS"
          jq -n --arg u "$GMAIL" --arg p "$PASS" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fields: {user: {stringValue: $u}, appPassword: {stringValue: $p}, savedAt: {stringValue: $t}}}' > doc.json
          curl -fsS -o /dev/null -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @doc.json "$FS/secretKeys/mailSender"
          rm -f doc.json
          back=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$FS/secretKeys/mailSender" | jq -r '.fields.appPassword.stringValue')
          [ "$back" = "$PASS" ] || { echo "::error::The saved password did not read back the same."; exit 1; }
          echo "Saved and read back: the app password ending in ${PASS: -4}."
          worker=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$FS/markerConfig/public" | jq -r '.fields.workerUrl.stringValue // empty')
          [[ "$worker" == https://* ]] || { echo "::error::The helper's address was not found."; exit 1; }
          answer=$(jq -n --arg e "$GMAIL" --arg u "https://www.cuberoot-systems.com/scorecard/join/?apply=1&e=thescorecard.marker%40gmail.com" '{email: $e, url: $u}' \
            | curl -sS --max-time 60 -X POST -H 'Content-Type: application/json' --data-binary @- "$worker/send-link" || true)
          echo "The helper answered: $answer"
          [ "$(echo "$answer" | jq -r '.sent // empty' 2>/dev/null)" = "true" ] || { echo "::error title=Test email failed::$answer"; exit 1; }
          echo "TEST EMAIL SENT to $GMAIL" >> "$GITHUB_STEP_SUMMARY"
