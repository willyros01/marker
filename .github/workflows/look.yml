name: Look (read only)
on:
  push:
    branches: [main]
    paths: [build/look.mjs]
permissions:
  contents: write   # only to save the result to the ci-logs branch
  id-token: write
env:
  PROJECT: scorecard-f41b8
jobs:
  look:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/811267714235/locations/global/workloadIdentityPools/scorecard-github/providers/marker-provider
          service_account: marker-deployer@scorecard-f41b8.iam.gserviceaccount.com
          token_format: access_token
      - env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node build/look.mjs > look.txt 2>&1 || true; tail -5 look.txt
      - if: always()
        run: |
          d="logs/look/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"; mkdir -p /tmp/$d; cp look.txt /tmp/$d/ || true
          git config user.name marker-ci; git config user.email marker-ci@users.noreply.github.com
          git fetch -q origin ci-logs && git checkout -q -B ci-logs origin/ci-logs
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
          mkdir -p $d; cp /tmp/$d/* $d/ || true
          git add logs && git commit -qm "look ${GITHUB_RUN_NUMBER}" && git push -q origin ci-logs
