name: Device tests - Android flows

# Willy, 23 Oct 2026: freeze lifted only for these automated tests. A TEST copy
# of The Scorecard (android branch, read-only) runs on an Android emulator
# against the Firebase EMULATORS on this machine; no live data is touched and
# the scorecard repository is never changed.
on:
  push:
    branches: [main]
    paths: [build/device/flows-android.mjs, build/device/adb.mjs, build/device/seed.mjs, build/device/build-test-apk.sh, .github/workflows/device-android-flows.yml]
  workflow_dispatch:

permissions:
  contents: write   # only to save the screenshots to the ci-logs branch

concurrency:
  group: device-android-flows
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/scorecard
          ref: android
          path: sca
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the test copy of the app (emulators only)
        run: bash build/device/build-test-apk.sh 2>&1 | tail -20
      - name: Start the Firebase emulators
        run: |
          npm install -g firebase-tools@15.31.0 > /dev/null 2>&1
          cd sca/test/ops && cp ../../firestore.rules firestore.rules.copy
          nohup firebase emulators:start --only firestore,auth --project demo-scorecard > /tmp/emulators.log 2>&1 &
          for i in $(seq 1 60); do curl -s 127.0.0.1:8080 > /dev/null && curl -s 127.0.0.1:9099 > /dev/null && break; sleep 2; done
          curl -s 127.0.0.1:9099 > /dev/null && echo "emulators up"
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an Android phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: |
            adb reverse tcp:8080 tcp:8080 && adb reverse tcp:9099 tcp:9099
            node build/device/flows-android.mjs out sca/android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee run.log
      - name: Save the report and screenshots to the ci-logs branch
        if: always()
        run: |
          set -e
          dir="logs/device-android-flows/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p "/tmp/$dir"; cp -R out/. "/tmp/$dir/" 2>/dev/null || true; cp run.log "/tmp/$dir/" 2>/dev/null || true; tail -50 /tmp/emulators.log > "/tmp/$dir/emulators-tail.log" 2>/dev/null || true
          git config user.name "marker-ci"; git config user.email "marker-ci@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch -q origin ci-logs && git checkout -q -B ci-logs origin/ci-logs
            git rm -rq --cached . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
            mkdir -p "$dir"; cp -R /tmp/$dir/. "$dir/"
            git add logs && git commit -qm "device-android-flows ${GITHUB_RUN_NUMBER}" && git push -q origin ci-logs && break
            sleep 5
          done
