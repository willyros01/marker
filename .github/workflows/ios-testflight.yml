name: iPhone build to TestFlight

# Builds The Marker for iPhone and uploads it to TestFlight when a push to main
# changes the version in version.js (or when started by hand). Modelled on The
# Scorecard's. The log is saved to the ci-logs branch with any key text removed.
on:
  push:
    branches: [main]
    paths: [version.js]
  workflow_dispatch:

permissions:
  contents: write   # only to save the log to the ci-logs branch

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the version change?
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "changed=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          now="$(grep -oE 'APP_VERSION = "[^"]+"' version.js)"
          before="$(git show "${{ github.event.before }}:version.js" 2>/dev/null | grep -oE 'APP_VERSION = "[^"]+"' || true)"
          echo "before: ${before:-none}   now: $now"
          [ "$now" != "$before" ] && echo "changed=yes" >> "$GITHUB_OUTPUT" || echo "changed=no" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.version.outputs.changed == 'yes'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'yes'
        with:
          node-version: "22"
      - name: Build and upload to TestFlight
        id: build
        if: steps.version.outputs.changed == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash build/ios-build.sh 2>&1 | tee build.log
      - name: Remove anything secret from the logs
        if: always() && steps.version.outputs.changed == 'yes'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          body="$(printf '%s' "$ASC_KEY_P8" | grep -v -- '-----' | tr -d '\n' | cut -c1-24)"
          for f in build.log xcodebuild.log; do
            [ -f "$f" ] || continue
            if [ -n "$body" ] && grep -qF -- "$body" "$f"; then grep -vF -- "$body" "$f" > "$f.clean"; mv "$f.clean" "$f"; fi
            grep -v -- 'PRIVATE KEY-----' "$f" > "$f.clean"; mv "$f.clean" "$f"
          done
      - name: Save the logs to the ci-logs branch
        if: always() && steps.version.outputs.changed == 'yes'
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -e
          dir="logs/testflight/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}-${OUTCOME}"
          mkdir -p "/tmp/$dir"; cp build.log "/tmp/$dir/" 2>/dev/null || true; tail -n 400 xcodebuild.log > "/tmp/$dir/xcodebuild-tail.log" 2>/dev/null || true
          git config user.name "marker-ci"; git config user.email "marker-ci@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch -q origin ci-logs && git checkout -q -B ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
            git rm -rq --cached . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
            mkdir -p "$dir"; cp /tmp/$dir/* "$dir/" 2>/dev/null || true
            git add logs && git commit -qm "TestFlight ${GITHUB_RUN_NUMBER}: ${OUTCOME}" && git push -q origin ci-logs && break
            sleep 5
          done
