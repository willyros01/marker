name: Promotional Text for both apps

# Willy, 1 Nov 2026, 8:19 pm: post the approved Promotional Text on the live
# App Store versions of The Scorecard and The Marker, so each app promotes the
# other. Revised 8:29 pm: The Marker keeps the caddie line first, The
# Scorecard at the end (Willy). Promotional Text needs no new version and no App Review. Changes only
# that one field; prints it before and after. Public text only.
on:
  push:
    branches: [main]
    paths: [.github/workflows/asc-promo.yml]

permissions:
  contents: write   # only to save the result to the ci-logs branch

jobs:
  promo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Post the Promotional Text
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          node > out.txt 2>&1 <<'JS' || true
          const crypto = require("crypto"); const e = process.env;
          const TEXT = {
            "io.github.willyros01.scorecard": "Pair it with The Marker: score your foursome hole by hole, let your caddie keep the card, and every round posts straight to your handicap here.",
            "io.github.willyros01.marker": "Playing with your caddie? Let them do the scoring and let the gang follow live. Every card posts straight to The Scorecard: handicaps, games and rankings.",
          };
          const LIVE = ["READY_FOR_SALE", "READY_FOR_DISTRIBUTION"];
          (async () => {
            for (const t of Object.values(TEXT)) if (t.length > 170) throw new Error("text over 170 characters: " + t.length);
            const key = crypto.createPrivateKey((e.ASC_KEY_P8 || "").trim());
            const b = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const head = b({ alg: "ES256", kid: e.ASC_KEY_ID.trim(), typ: "JWT" });
            const body = b({ iss: e.ASC_ISSUER_ID.trim(), iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const jwt = `${head}.${body}.` + crypto.sign("sha256", Buffer.from(head + "." + body), { key, dsaEncoding: "ieee-p1363" }).toString("base64url");
            const H = { Authorization: "Bearer " + jwt, "Content-Type": "application/json" };
            const get = async (p) => { const r = await fetch("https://api.appstoreconnect.apple.com/v1/" + p, { headers: H }); const j = await r.json(); if (!r.ok) throw new Error(`GET ${p}: ${r.status} ${JSON.stringify(j.errors || j)}`); return j; };
            let changed = 0;
            for (const [bundle, text] of Object.entries(TEXT)) {
              const app = (await get(`apps?filter[bundleId]=${bundle}&limit=2`)).data[0];
              if (!app) { console.log(`${bundle}: app not found`); continue; }
              const name = app.attributes.name;
              const versions = (await get(`apps/${app.id}/appStoreVersions?limit=10`)).data;
              const live = versions.filter((v) => LIVE.includes(v.attributes.appVersionState || v.attributes.appStoreState));
              if (!live.length) { console.log(`${name}: no live version found (${versions.map((v) => v.attributes.versionString + " " + (v.attributes.appVersionState || v.attributes.appStoreState)).join(", ")})`); continue; }
              for (const v of live) {
                for (const l of (await get(`appStoreVersions/${v.id}/appStoreVersionLocalizations`)).data) {
                  const before = l.attributes.promotionalText || "";
                  console.log(`\n${name} ${v.attributes.versionString} ${l.attributes.locale}\nBEFORE: "${before}"`);
                  if (before === text) { console.log("ALREADY SET, nothing to change"); continue; }
                  const r = await fetch(`https://api.appstoreconnect.apple.com/v1/appStoreVersionLocalizations/${l.id}`, {
                    method: "PATCH", headers: H,
                    body: JSON.stringify({ data: { type: "appStoreVersionLocalizations", id: l.id, attributes: { promotionalText: text } } }),
                  });
                  const j = await r.json().catch(() => ({}));
                  if (!r.ok) { console.log(`FAILED: ${r.status} ${JSON.stringify(j.errors || j)}`); continue; }
                  const after = (await get(`appStoreVersionLocalizations/${l.id}`)).data.attributes.promotionalText || "";
                  console.log(`AFTER:  "${after}"\n${after === text ? "OK, saved" : "MISMATCH, please check"}`);
                  if (after === text) changed++;
                }
              }
            }
            console.log(`\nDone: ${changed} changed.`);
          })().catch((x) => console.log("error: " + x.message));
          JS
          cat out.txt
      - name: Save the result to the ci-logs branch
        if: always()
        run: |
          set -e
          dir="logs/asc-promo/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p "/tmp/$dir"; cp out.txt "/tmp/$dir/" 2>/dev/null || true
          git config user.name "marker-ci"; git config user.email "marker-ci@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin ci-logs && git checkout -q -B ci-logs origin/ci-logs
            git rm -rq --cached . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name logs -exec rm -rf {} +
            mkdir -p "$dir"; cp /tmp/$dir/* "$dir/" 2>/dev/null || true
            git add logs && git commit -qm "asc promo ${GITHUB_RUN_NUMBER}" && git push -q origin ci-logs && break
            sleep 5
          done
